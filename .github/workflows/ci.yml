name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 2026-refresh

jobs:
  test:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

# Playwright's visual regression suite (tests/visual/, `npm run test:visual`)
# is deliberately NOT run here. It needs seeded fixture data (see
# tests/visual/README.md) that today only exists via direct Supabase MCP
# access to seed around RLS, and there is no SUPABASE_SERVICE_ROLE_KEY
# available to a CI runner to do that instead. Run it manually until that
# gap (tracked as D14 in docs/tech-debt-backlog.md) is closed.
